name: Browser gameplay quality gate

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/browser-gameplay.yml'
  push:
    branches:
      - feature/phase-9-platform-expansion
    paths:
      - 'web/**'
      - '.github/workflows/browser-gameplay.yml'

permissions:
  contents: read

jobs:
  browser-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated browser harness
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: TypeScript and production build
        run: |
          npm run typecheck
          npm run build
      - name: Launch production frontend
        run: |
          npm run start -- -p 3100 > /tmp/educyber-next.log 2>&1 &
          echo $! > /tmp/educyber-next.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3100/account > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/educyber-next.log
          exit 1
      - name: Browser gameplay journeys (mock API, real browser)
        run: node --test tests/browser/gameplay.test.cjs
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/educyber-next.log || true
