name: Red Blue V2 contract
on:
  pull_request:
    branches: [feature/secure-password-recovery]
    paths:
      - "api/cyber_warfare/v2_*.py"
      - "api/cyber_warfare/test_v2_state.py"
      - "api/cyber_warfare/test_v2_events.py"
      - ".github/workflows/red-blue-v2-contract.yml"
  push:
    branches: [feature/beta-continuous-improvement]
    paths:
      - "api/cyber_warfare/v2_*.py"
      - "api/cyber_warfare/test_v2_state.py"
      - "api/cyber_warfare/test_v2_events.py"
      - ".github/workflows/red-blue-v2-contract.yml"
permissions:
  contents: read
jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated scenario and contract dependencies
        run: python -m pip install "pytest>=8,<10" "pydantic>=2,<3"
      - name: Validate all six scenarios and V2 secrecy contract
        working-directory: api
        run: python -m pytest -q cyber_warfare/test_v2_state.py cyber_warfare/test_v2_events.py
      - name: Validate syntax of V2 modules
        working-directory: api
        run: python -m compileall -q cyber_warfare/v2_state.py cyber_warfare/v2_validation.py cyber_warfare/v2_scenario.py cyber_warfare/v2_events.py
