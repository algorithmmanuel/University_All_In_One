name: Backend quality gate

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - "feature/phase-8-engineering-hardening"
      - "feature/phase-9-platform-expansion"
      - "feature/beta-continuous-improvement"
    paths:
      - "api/**"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-ci.lock
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-ci.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run database-independent tests
        env:
          TEST_DATABASE_URL: ""
          # Placeholder is parsed only; integration tests skip without TEST_DATABASE_URL.
          DATABASE_URL: "postgresql+psycopg://ci:ci@127.0.0.1:5433/educyber_test"
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: educyber_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: educyber_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U educyber_ci -d educyber_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://educyber_ci:ci_only_password@127.0.0.1:5434/educyber_test
      DATABASE_URL: postgresql+psycopg://educyber_ci:ci_only_password@127.0.0.1:5434/educyber_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-ci.lock
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip check
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Run full backend suite against isolated PostgreSQL
        run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install application and audit tooling
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip check
      - name: Audit resolved Python dependencies
        run: python -m pip_audit
