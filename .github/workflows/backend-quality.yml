name: Backend quality gate

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - "feature/phase-8-engineering-hardening"
    paths:
      - "api/**"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run database-independent tests
        env:
          TEST_DATABASE_URL: ""
          DATABASE_URL: ""
        run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install application and audit tooling
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
      - name: Audit resolved Python dependencies
        run: python -m pip_audit
